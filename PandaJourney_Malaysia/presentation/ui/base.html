<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PandaJourney Malaysia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<header class="top-header">
    <div class="brand">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="PandaJourney Logo" class="logo">
        <div>
            <h1>PandaJourney Malaysia</h1>
            <p>Smart Tourism Planning Platform</p>
        </div>
    </div>
</header>

<nav class="module-nav">
    <a href="{{ url_for('smart_attraction') }}" class="module-card">
        <div class="module-icon">📍</div>
        <span>Attraction</span>
    </a>

    <a href="{{ url_for('smart_itinerary') }}" class="module-card">
        <div class="module-icon">🗺️</div>
        <span>Itinerary</span>
    </a>

    <a href="{{ url_for('collaboration') }}" class="module-card">
        <div class="module-icon">👥</div>
        <span>Collaboration</span>
    </a>

    <a href="{{ url_for('user_management') }}" class="module-card">
        <div class="module-icon">👤</div>
        <span>User</span>
    </a>
</nav>

<main class="content-area">
    {% block content %}{% endblock %}
</main>

{% block extra_scripts %}{% endblock %}

</body>
</html>
